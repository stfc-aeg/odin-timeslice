[server]
debug_mode = 1
http_port  = 8888
http_addr  = 127.0.0.1
enable_cors = true
static_path = test/static
adapters   = timeslice, system_info

[tornado]
logging = debug

[adapter.timeslice]
module = timeslice.adapter.TimesliceAdapter
rendered_files = test/static/timeslice/public/renders
send_files = test/static/timeslice/public/renders
source_email = Timeslice Team <TimesliceTeam@stfc.ac.uk>
config_message =
    Hello,

    You requested {2} videos to be sent, which have been attached.

    Please enjoy,
    STFC


[adapter.system_info]
module = odin.adapters.system_info.SystemInfoAdapter



