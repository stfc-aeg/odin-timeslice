[server]
debug_mode = 1
http_port  = 8889
http_addr  = 127.0.0.1
static_path = /home/pi/develop/projects/timeslice/odin-timeslice/test/static
adapters   = timeslice, system_info

[tornado]
logging = debug

[adapter.timeslice]
module = timeslice.adapter.TimesliceAdapter
background_task_enable = 1
background_task_interval = 1.0
rendered_files = /data/timeslice/saved_videos
smtp_relay = ob-mgw.stfc.ac.uk
smtp_port = 26
source_email_addr = visitral@stfc.ac.uk
config_message = Hello,

    Here are the timeslice camera access codes you entered during your visit:
    {1}

    Their corresponding timeslice videos are attached to this email.

    Please enjoy,
    STFC


[adapter.system_info]
module = odin.adapters.system_info.SystemInfoAdapter



